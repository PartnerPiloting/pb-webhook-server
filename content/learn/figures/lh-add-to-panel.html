<style>
  .lhp { background:#2b3040; color:#d7dbe6; border-radius:6px; padding:14px 16px 12px; max-width:340px; margin:0 auto; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; }

  .lhp-seg span.on { background:#4f7cf7; color:#fff; font-weight:600; }
  .lhp-list span { display:block; margin:0 0 5px 14px; padding:6px 10px; border-radius:5px; background:#1f2330; color:#c3c9d8; font-size:12px; }
  .lhp-list span.on { background:#4f7cf7; color:#fff; font-weight:600; }

  .lhp-list span { display:flex; align-items:center; }

<div class="lhp">
  <h5>&#8249; Add selected contacts to list</h5>
  <div class="lhp-sel mk"><span>New campaign &#9662;</span><b class="n">4</b></div>
